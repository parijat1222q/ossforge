# New setup: copy to local ossforge.yaml, then fill the three identity values below.
# Do not put passwords/tokens here. Run doctor and whoami before the IDE prompt.
# Other keys are optional; repo_first is an explicit workflow choice.
repo_first: false         # true for repository-first IDE research; no search starts merely by setting this
daily_cap: 2              # hard maximum is 2 regardless of this value
signoff: false            # true = add DCO Signed-off-by everywhere. Prefer signoff_repos below: a sign-off is your own attestation
signoff_repos: []         # repos ("owner/name") where you approved the DCO sign-off after reading it
disclosure: auto          # auto = add the AI-assistance note only where the repo asks for it; true / false to force
github_user: ""           # REQUIRED to publish: must equal the gh login (`gh auth status`)
git_name: ""              # REQUIRED to publish: expected commit author AND committer name
git_email: ""             # REQUIRED to publish: expected commit author AND committer email
work_kind: both          # fix = no alternate-day feature searches; both preserves existing behavior
min_repo_score: 60
min_stars: 500
languages: [python]
labels: ["help wanted", "good first issue"]
max_open_prs_per_repo: 1
cooldown_days: 14
auto_submit: false        # true: the loop submits already-verified items by itself
patch_command: ""         # optional shell command; env OSSFORGE_ITEM is the item id
own_orgs: []             # orgs that are yours: repos there are ignored by bootstrap. Orgs you merely belong to are listed, not counted

# Optional Linux native-test/check containment. Default none is not isolation.
# Dependencies/interpreters must be prepared separately; no network inside.
verification_isolation: none  # none | bwrap, requested unavailable never falls back
verification_readonly_paths: []  # explicit absolute prepared runtime directories
