[project]
name = "ossforge"
version = "0.1.0"
readme = "README.md"
description = "Scout, vet, and prepare quality open-source contributions (fix + feature) with a daily cap."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.urls]
Repository = "https://github.com/parijat1222q/ossforge"
Documentation = "https://github.com/parijat1222q/ossforge/blob/main/docs/local-ai.md"

[project.optional-dependencies]
# Normal users need Ruff in this Python environment for doctor and source scanning.
tools = ["ruff>=0.5"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ossforge = "ossforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ossforge"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "B", "W"]
ignore = ["E501", "B905"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "ossforge/public_guides/AGENTS.md"
"docs/local-ai.md" = "ossforge/public_guides/docs/local-ai.md"
"ossforge.example.yaml" = "ossforge/public_guides/ossforge.example.yaml"
